
name: Build C++ EXE

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Compile C++
        run: |
          g++ ProgramNama.cpp -o ProgramNama.exe

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: ProgramNama
          path: ProgramNama.exe
